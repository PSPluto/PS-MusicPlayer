<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Visualizer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: drag;
    }

    body {
      cursor: grab;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="visualizer-canvas"></canvas>
  <script src="visualizer.js"></script>
</body>
</html>
